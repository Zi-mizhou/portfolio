  <rect x="400" y="364" width="100" height="6" rx="1" fill="rgba(0,0,0,.08)"/>
  
  <!-- Formula -->
  <text x="410" y="395" fill="#1a1a2e" font-family="Georgia,serif" font-size="14" font-style="italic">u = √(Σ cᵢ²uᵢ²)</text>
  
