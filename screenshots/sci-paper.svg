  <text x="716" y="120" fill="rgba(99,102,241,.8)" font-family="Inter,sans-serif" font-size="11" font-weight="600">Uncertainty</text>
  <text x="716" y="140" fill="rgba(99,102,241,.5)" font-family="Inter,sans-serif" font-size="9">Evaluation</text>
