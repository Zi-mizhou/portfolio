  <rect x="295" y="272" width="80" height="14" rx="3" fill="rgba(16,185,129,.1)" stroke="rgba(16,185,129,.2)"/>
  <text x="302" y="283" fill="#10b981" font-family="Georgia,serif" font-size="9">Uncertainty Evaluation</text>
  
  <rect x="385" y="272" width="70" height="14" rx="3" fill="rgba(251,146,60,.1)" stroke="rgba(251,146,60,.2)"/>
