  <!-- Area under line -->
  <polyline points="50,280 80,275 110,265 140,270 170,255 200,250 230,245 260,240 290,235 320,225 350,230 380,220 410,215 440,210 470,205 470,380 50,380" fill="rgba(78,225,190,.06)"/>
  
