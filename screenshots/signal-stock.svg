<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b111d"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="teal2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ee1be"/>
      <stop offset="100%" stop-color="#2bb3a0"/>
    </linearGradient>
    <linearGradient id="red2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7c7c"/>
      <stop offset="100%" stop-color="#ff5050"/>
    </linearGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  
  <!-- Header -->
