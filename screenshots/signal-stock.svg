  <text x="550" y="376" fill="#f2f6fb" font-family="Inter,sans-serif" font-size="14" font-weight="700">1.24%</text>
  
  <rect x="658" y="340" width="110" height="42" rx="8" fill="rgba(0,0,0,.15)"/>
  <text x="670" y="358" fill="#8c9bb0" font-family="Inter,sans-serif" font-size="9">风险等级</text>
  <text x="670" y="376" fill="#ffb65c" font-family="Inter,sans-serif" font-size="14" font-weight="700">中等</text>
  
