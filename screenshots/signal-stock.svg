  <text x="32" y="450" fill="#f2f6fb" font-family="Inter,sans-serif" font-size="20" font-weight="700">¥176.88</text>
  <text x="132" y="450" fill="#4ee1be" font-family="Inter,sans-serif" font-size="12">+1.44%</text>
  
  <rect x="210" y="406" width="180" height="74" rx="10" fill="rgba(16,25,37,.6)" stroke="rgba(255,255,255,.06)"/>
  <text x="226" y="426" fill="#8c9bb0" font-family="Inter,sans-serif" font-size="10">最高 / 最低</text>
  <text x="226" y="446" fill="#f2f6fb" font-family="Inter,sans-serif" font-size="14">¥179.88 / ¥176.50</text>
  <text x="226" y="464" fill="#8c9bb0" font-family="Inter,sans-serif" font-size="10">振幅 1.88%</text>
  
  <rect x="404" y="406" width="102" height="74" rx="10" fill="rgba(16,25,37,.6)" stroke="rgba(255,255,255,.06)"/>
  <text x="420" y="426" fill="#8c9bb0" font-family="Inter,sans-serif" font-size="10">成交量</text>
  <text x="420" y="450" fill="#f2f6fb" font-family="Inter,sans-serif" font-size="20" font-weight="700">52.3M</text>
  <text x="420" y="464" fill="#8c9bb0" font-family="Inter,sans-serif" font-size="10">较昨日 +15%</text>
