  <rect x="380" y="344" width="65" height="8" rx="4" fill="#4ee1be"/>
  <text x="486" y="352" fill="#4ee1be" font-family="Inter,sans-serif" font-size="9" font-weight="600">65%</text>
  
  <text x="316" y="372" fill="#8c9bb0" font-family="Inter,sans-serif" font-size="9">回复速度</text>
  <rect x="380" y="364" width="100" height="8" rx="4" fill="rgba(255,255,255,.1)"/>
  <rect x="380" y="364" width="72" height="8" rx="4" fill="#ffb65c"/>
  <text x="486" y="372" fill="#ffb65c" font-family="Inter,sans-serif" font-size="9" font-weight="600">72%</text>
  
  <text x="316" y="392" fill="#8c9bb0" font-family="Inter,sans-serif" font-size="9">话题延续</text>
  <rect x="380" y="384" width="100" height="8" rx="4" fill="rgba(255,255,255,.1)"/>
  <rect x="380" y="384" width="88" height="8" rx="4" fill="#9b8ec4"/>
  <text x="486" y="392" fill="#9b8ec4" font-family="Inter,sans-serif" font-size="9" font-weight="600">88%</text>
  
  <!-- Bottom action -->
  <rect x="300" y="448" width="200" height="12" rx="6" fill="rgba(124,58,237,.2)"/>
  
  <!-- Side decorations -->
  <circle cx="120" cy="250" r="40" fill="none" stroke="rgba(236,72,153,.2)" stroke-width="1"/>
  <circle cx="120" cy="250" r="55" fill="none" stroke="rgba(236,72,153,.1)" stroke-width="1"/>
  <text x="120" y="255" fill="rgba(236,72,153,.3)" font-family="Inter,sans-serif" font-size="40" text-anchor="middle">💬</text>
  
  <circle cx="680" cy="250" r="40" fill="none" stroke="rgba(78,225,190,.2)" stroke-width="1"/>
  <circle cx="680" cy="250" r="55" fill="none" stroke="rgba(78,225,190,.1)" stroke-width="1"/>
  <text x="680" y="255" fill="rgba(78,225,190,.3)" font-family="Inter,sans-serif" font-size="40" text-anchor="middle">🤖</text>
  
