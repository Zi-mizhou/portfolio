  <text x="80" y="380" fill="rgba(255,255,255,.06)" font-family="Inter,sans-serif" font-size="14" font-weight="700">AI 辅助</text>
  <text x="620" y="380" fill="rgba(255,255,255,.06)" font-family="Inter,sans-serif" font-size="14" font-weight="700">风格识别</text>
