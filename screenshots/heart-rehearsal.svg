<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="pink3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  
  <!-- Phone frame -->
  <rect x="280" y="20" width="240" height="460" rx="28" fill="#1a1a2e" stroke="rgba(255,255,255,.1)" stroke-width="2"/>
  <rect x="292" y="34" width="216" height="432" rx="20" fill="#0d0d1a"/>
  
  <!-- Phone header -->
