  <text x="348" y="138" fill="#5a6178" font-family="Inter,sans-serif" font-size="8" text-anchor="end">14:35</text>
  
  <rect x="300" y="160" width="160" height="50" rx="12" fill="rgba(124,58,237,.2)"/>
  <text x="312" y="178" fill="#d8c8f0" font-family="Inter,sans-serif" font-size="10">一个人看啊？</text>
  <text x="312" y="194" fill="#d8c8f0" font-family="Inter,sans-serif" font-size="10">一起看不？</text>
  <text x="446" y="202" fill="#5a6178" font-family="Inter,sans-serif" font-size="8">14:36</text>
  
  <rect x="360" y="216" width="120" height="36" rx="12" fill="rgba(78,225,190,.15)"/>
  <text x="372" y="236" fill="#b8e8d4" font-family="Inter,sans-serif" font-size="10">好啊，什么剧</text>
  <text x="348" y="236" fill="#5a6178" font-family="Inter,sans-serif" font-size="8" text-anchor="end">14:37</text>
  
  <!-- Divider -->
