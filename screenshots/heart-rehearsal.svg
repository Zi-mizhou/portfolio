  <text x="486" y="332" fill="#ec4899" font-family="Inter,sans-serif" font-size="9" font-weight="600">82%</text>
  
  <text x="316" y="352" fill="#8c9bb0" font-family="Inter,sans-serif" font-size="9">幽默感</text>
