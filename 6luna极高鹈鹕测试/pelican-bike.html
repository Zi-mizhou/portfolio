<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>海风骑行 · 鹈鹕自行车动画</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f2f5e9,#c9e6e4);color:#28434d;font-family:ui-rounded,"Segoe UI",system-ui,sans-serif}
.card{width:min(100%,980px);overflow:hidden;border:1px solid #ffffffbd;border-radius:26px;background:#fffaf0;box-shadow:0 24px 65px #426d6929}
header{display:flex;align-items:center;justify-content:space-between;padding:23px 30px 17px}.eyebrow{margin:0 0 5px;color:#689893;font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}h1{margin:0;font-size:clamp(24px,4vw,34px);letter-spacing:-.04em}.sub{margin:6px 0 0;color:#748a8d;font-size:14px}.badge{border:1px solid #d9e8d9;border-radius:99px;padding:8px 12px;background:#f5faef;color:#59847d;font-size:12px;font-weight:750}.badge:before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:#85bd8c}
.frame{padding:0 16px}svg{display:block;width:100%;height:auto;border-radius:17px;background:#b8e1df}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 29px 21px;color:#71868a;font-size:13px}.buttons{display:flex;gap:8px}button{border:1px solid #d5e3d9;border-radius:99px;padding:9px 14px;background:#fffdf8;color:#48656b;font:inherit;font-size:12px;font-weight:750;cursor:pointer}button:hover{background:#f1f8ed}button:focus-visible{outline:3px solid #75b7aa;outline-offset:2px}button.primary{border-color:#ef795e;background:#ef795e;color:white}.primary:hover{background:#df6d55}
.cloud{animation:drift 24s linear infinite}.cloud.later{animation-duration:34s;animation-delay:-13s}.bob{transform-box:view-box;transform-origin:500px 265px;animation:bob 1.1s ease-in-out infinite}.tail{transform-box:fill-box;transform-origin:100% 50%;animation:tail 1.1s ease-in-out infinite}.spokes{transform-box:fill-box;transform-origin:center;animation:spin 1.35s linear infinite}.glint{animation:glint 2.4s ease-in-out infinite alternate}.glint.late{animation-delay:-1s}.dash{animation:road 1.4s linear infinite}.paused .anim{animation-play-state:paused!important}.paused .spokes,.paused .cloud,.paused .bob,.paused .tail,.paused .glint,.paused .dash{animation-play-state:paused!important}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-5px)}}@keyframes tail{50%{transform:rotate(3deg)}}@keyframes drift{from{transform:translateX(-150px)}to{transform:translateX(1050px)}}@keyframes glint{from{opacity:.25;transform:translateX(-4px)}to{opacity:.8;transform:translateX(4px)}}@keyframes road{to{stroke-dashoffset:-86}}
@media(max-width:600px){body{padding:10px}.card{border-radius:19px}header{padding:18px 17px 13px}.sub{font-size:12px}.badge{padding:7px 9px;font-size:10px}.frame{padding:0 8px}.controls{padding:13px 16px 17px;font-size:11px}button{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="card">
<header><div><p class="eyebrow">A little ride by the bay</p><h1>海风骑行 ✦</h1><p class="sub">一只鹈鹕，和一段慢悠悠的海岸线。</p></div><div class="badge">SVG 2D 动画</div></header>
<div class="frame">
<svg id="scene" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">鹈鹕骑着自行车沿海岸前行</title><desc id="desc">夕阳下，戴着小头盔的鹈鹕骑着自行车，车轮、脚蹬、云朵和海面都在运动。</desc>
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#9edbd9"/><stop offset=".7" stop-color="#e5edd5"/><stop offset="1" stop-color="#f6e6c1"/></linearGradient>
<linearGradient id="sea" x2="0" y2="1"><stop stop-color="#79c5c2"/><stop offset="1" stop-color="#5aa4ad"/></linearGradient>
<linearGradient id="bill" x2="1" y2="1"><stop stop-color="#ffd069"/><stop offset="1" stop-color="#f28a4a"/></linearGradient>
<clipPath id="clip"><rect width="1000" height="590" rx="18"/></clipPath>
<filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<g clip-path="url(#clip)">
<rect width="1000" height="590" fill="url(#sky)"/>
<circle cx="820" cy="112" r="49" fill="#ffe39a"/><circle cx="820" cy="112" r="66" fill="#ffe39a" opacity=".18"/>
<path d="M0 250q130-34 250 0t250 0t250 0t300 0v100H0z" fill="#b5ddcf"/>
<path d="M0 295q150-25 300 0t300 0t400 0v190H0z" fill="url(#sea)"/>
<path d="M0 311q130-18 260 0t260 0t260 0t300 0" fill="none" stroke="#e6f2d9" stroke-width="3" opacity=".7"/>
<g class="cloud anim" fill="#fffdf1" opacity=".86"><ellipse cx="115" cy="104" rx="49" ry="17"/><circle cx="95" cy="94" r="20"/><circle cx="125" cy="87" r="26"/><ellipse cx="151" cy="99" rx="26" ry="17"/></g>
<g class="cloud later anim" fill="#fffdf1" opacity=".7"><ellipse cx="500" cy="164" rx="39" ry="13"/><circle cx="480" cy="155" r="17"/><circle cx="506" cy="150" r="20"/><ellipse cx="529" cy="161" rx="22" ry="13"/></g>
<g fill="none" stroke="#d8efdd" stroke-linecap="round" opacity=".75"><path class="glint anim" d="M62 340h62" stroke-width="3"/><path class="glint late anim" d="M188 374h38" stroke-width="2"/><path class="glint late anim" d="M818 338h72" stroke-width="3"/><path class="glint anim" d="M715 388h44" stroke-width="2"/></g>
<path d="M0 422q170-15 340 2t350 0t310 0v166H0z" fill="#f5e6c5"/><path d="M0 439q160-11 325 0t335 0t340 0" fill="none" stroke="#d8c99f" stroke-width="3"/>
<ellipse cx="510" cy="512" rx="320" ry="18" fill="#4d7774" opacity=".17" filter="url(#blur)"/>
<!-- bicycle wheels -->
<g><circle cx="330" cy="435" r="91" fill="#f8f2df" stroke="#304956" stroke-width="9"/><circle cx="330" cy="435" r="79" fill="none" stroke="#8da9a3" stroke-width="2"/><g class="spokes anim" stroke="#6b898a" stroke-width="2"><path d="M330 356v158M251 435h158M274 379l112 112m0-112L274 491M302 361l56 148M256 407l148 56m-46-102-56 148m-46-48 148-56"/></g><circle cx="330" cy="435" r="8" fill="#ef795e" stroke="#fff8e8" stroke-width="3"/></g>
<g><circle cx="690" cy="435" r="91" fill="#f8f2df" stroke="#304956" stroke-width="9"/><circle cx="690" cy="435" r="79" fill="none" stroke="#8da9a3" stroke-width="2"/><g class="spokes anim" stroke="#6b898a" stroke-width="2"><path d="M690 356v158M611 435h158M634 379l112 112m0-112L634 491M662 361l56 148m-102-102 148 56m-46-102-56 148m-46-48 148-56"/></g><circle cx="690" cy="435" r="8" fill="#ef795e" stroke="#fff8e8" stroke-width="3"/></g>
<!-- bike frame -->
<g fill="none" stroke="#347e7c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M330 435l102-98 88 98H330M432 337h168l-80 98m80-98 90 98"/></g>
<g fill="none" stroke="#30515a" stroke-width="9" stroke-linecap="round"><path d="M432 337l-10-23m-17 0q18-7 37 0"/><path d="M600 337l10-42 31-7m-9 0 18 6"/></g>
<circle cx="520" cy="435" r="13" fill="#f6b64b" stroke="#30515a" stroke-width="5"/>
<g id="crank" fill="none" stroke="#30515a" stroke-width="6" stroke-linecap="round"><path d="M520 435v-33m0 33v33m-12-33h24"/></g>
<!-- legs and webbed feet -->
<g fill="none" stroke="#42666a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><path id="legA" d="M0 0"/><path id="legB" d="M0 0"/></g>
<g fill="none" stroke="#91a9a1" stroke-width="4" stroke-linecap="round"><path id="shineA" d="M0 0"/><path id="shineB" d="M0 0"/></g>
<g id="footA" fill="#ef795e" stroke="#b84e49" stroke-width="2"><path d="M0-5q10-4 18 1l-2 5H7l-3 7-4-1 1-6-7 5-3-3 6-6z"/></g>
<g id="footB" fill="#f28b5b" stroke="#b84e49" stroke-width="2"><path d="M0-5q10-4 18 1l-2 5H7l-3 7-4-1 1-6-7 5-3-3 6-6z"/></g>
<!-- pelican -->
<g class="bob anim">
<g class="tail anim" fill="#f3f1e4" stroke="#d2d7c9" stroke-width="2"><path d="M438 249q-36-19-45-41 33 8 53 24z"/><path d="M440 256q-38-5-57-23 34 1 63 9z"/></g>
<path d="M526 226q18-19 9-59-6-29 19-38 33-10 44 17 9 22-24 42l-15 33z" fill="#fff9e9" stroke="#d7d9c9" stroke-width="3"/>
<path d="M434 234q1-59 75-58 75 1 64 71-6 58-76 58-65-4-63-71z" fill="#fff9e9" stroke="#d7d9c9" stroke-width="3"/>
<path d="M481 253q35 20 76-8-9 50-59 46-23-3-34-24z" fill="#f2e9d4"/>
<path d="M466 219q14-25 51-28 44 0 39 44-14 29-60 20-44-9-30-36z" fill="#d9e1d7" stroke="#bbc9be" stroke-width="3"/>
<path d="M476 230q29 12 66 1m-60 11q28 12 53 4" fill="none" stroke="#b9c9c1" stroke-width="4" stroke-linecap="round"/>
<circle cx="568" cy="145" r="29" fill="#fff9e9" stroke="#d7d9c9" stroke-width="3"/>
<path d="M544 132q8-23 30-17 15 3 21 19-20-7-47 4z" fill="#ef795e"/><path d="M571 119q17-3 29 8-11 5-22 1z" fill="#f6b64b"/>
<path d="M590 145q64-14 142 13-60 13-140 5z" fill="url(#bill)" stroke="#ce7747" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M592 161q64 9 128-2-19 40-75 35-40-3-53-33z" fill="#ed795e" stroke="#cb5e50" stroke-width="2.5"/>
<path d="M605 168q37 10 85 3" fill="none" stroke="#f7b078" stroke-width="2"/>
<circle cx="579" cy="143" r="4.3" fill="#263d49"/><circle cx="580" cy="141.5" r="1.4" fill="white"/>
</g>
<!-- handlebar in foreground -->
<g fill="none" stroke="#30515a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M600 337l10-42 31-7m-9 0 18 6"/></g><circle cx="610" cy="295" r="6" fill="#ef795e"/>
<path class="dash anim" d="M0 539h1000" stroke="#fff9e9" stroke-width="5" stroke-dasharray="44 42" opacity=".68"/>
<path d="M0 550q180-19 330 1t320-3 350 3v39H0z" fill="#b3c990" opacity=".7"/>
<g stroke="#6e9a76" stroke-width="3" stroke-linecap="round"><path d="m80 557-4-12m4 12 5-9m835 10-3-13m3 13 6-10"/></g>
</g></svg>
</div>
<div class="controls"><span>☀　海风刚刚好，继续出发吧。</span><div class="buttons"><button id="toggle" class="primary" aria-pressed="false">暂停动画</button><button id="replay">重新开始</button></div></div>
</main>
<script>
(()=>{const scene=document.getElementById("scene"),toggle=document.getElementById("toggle"),replay=document.getElementById("replay"),crank=document.getElementById("crank");
const legs=[{path:document.getElementById("legA"),shine:document.getElementById("shineA"),foot:document.getElementById("footA"),x:485,y:286,p:0},{path:document.getElementById("legB"),shine:document.getElementById("shineB"),foot:document.getElementById("footB"),x:511,y:288,p:Math.PI}];
let paused=false,start=performance.now(),pauseAt=0;
function draw(leg,a){const x=520+Math.cos(a)*33,y=435+Math.sin(a)*33,kx=leg.x+(x-leg.x)*.55+(leg.p===0?-12:11),ky=leg.y+(y-leg.y)*.55,d="M "+leg.x+" "+leg.y+" Q "+(leg.x+13)+" "+(leg.y+31)+" "+kx.toFixed(1)+" "+ky.toFixed(1)+" Q "+(kx+12)+" "+(ky+30)+" "+x.toFixed(1)+" "+y.toFixed(1);leg.path.setAttribute("d",d);leg.shine.setAttribute("d",d);leg.foot.setAttribute("transform","translate("+(x-2).toFixed(1)+" "+(y-1).toFixed(1)+") rotate("+(Math.sin(a)*9).toFixed(1)+")")}
function tick(now){if(!paused){const a=(now-start)/1000*3.35-Math.PI/2;crank.setAttribute("transform","rotate("+(a*180/Math.PI).toFixed(1)+" 520 435)");legs.forEach(l=>draw(l,a+l.p))}requestAnimationFrame(tick)}
requestAnimationFrame(tick);
toggle.onclick=()=>{paused=!paused;if(paused){scene.classList.add("paused");toggle.textContent="继续动画";toggle.setAttribute("aria-pressed","true");pauseAt=performance.now()}else{start+=performance.now()-pauseAt;scene.classList.remove("paused");toggle.textContent="暂停动画";toggle.setAttribute("aria-pressed","false")}};
replay.onclick=()=>{start=performance.now();paused=false;scene.classList.remove("paused");toggle.textContent="暂停动画";toggle.setAttribute("aria-pressed","false")};
})();
</script>
</body></html>
